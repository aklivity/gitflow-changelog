name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 0.1.0 (no leading "v")
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Release v${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure git credentials
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GITFLOW_RELEASES_TOKEN }}@github.com" > ~/.git-credentials

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Bump version and build
        run: |
          npm version "${{ inputs.version }}" --no-git-tag-version
          npm run build

      - name: Commit, tag, and push
        env:
          GH_TOKEN: ${{ secrets.GITFLOW_RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          MAJOR="v$(echo "$VERSION" | cut -d. -f1)"

          # dist/ and merge-report/index.js are gitignored on the branch
          # itself — force-add them into this one release commit, which is
          # reachable only via the tags below, never pushed onto the branch.
          # develop/main stay build-artifact-free forever.
          git add package.json package-lock.json
          git add -f dist
          git add -f merge-report/index.js
          git commit -m "chore(release): v${VERSION}"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git tag -f "$MAJOR" HEAD

          # A re-run after a partial prior failure re-creates v${VERSION} as a
          # fresh local tag object (new timestamp/sha) — pushing it again is
          # rejected as non-fast-forward if an earlier attempt's push already
          # succeeded. That's fine: the remote tag already points at a valid
          # release commit, there's nothing left to do for it.
          git push origin "v${VERSION}" || echo "::warning::v${VERSION} already exists on origin, skipping"
          git push origin -f "$MAJOR"

          # gh release create's --generate-notes call hits GitHub's GraphQL
          # API and can transiently rate-limit independently of whether the
          # release itself already exists — retry a few times with backoff,
          # then warn (not fail) rather than take down the whole job over
          # this cosmetic step. The tag/commit above are what actually
          # matters; @v0/@v<version> consumers already work regardless of
          # whether the Release page exists yet.
          last_error=""
          attempts=3
          for attempt in $(seq 1 "$attempts"); do
            if last_error=$(gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes 2>&1); then
              exit 0
            fi
            echo "::warning::gh release create attempt ${attempt} failed for v${VERSION}: ${last_error//$'\n'/ }"
            if [ "$attempt" -lt "$attempts" ]; then
              sleep $((attempt * 15))
            fi
          done

          # gh api rate_limit is exempt from the very limits it reports, so
          # this is safe to call even when graphql itself is exhausted — best
          # effort, since the failure above might not even be a rate limit.
          reset_hint=""
          reset_epoch=$(gh api rate_limit --jq '.resources.graphql.reset' 2>/dev/null || true)
          if [ -n "$reset_epoch" ]; then
            reset_human=$(date -u -d "@${reset_epoch}" '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || echo "$reset_epoch")
            reset_hint=" GraphQL quota resets at ${reset_human}."
          fi

          echo "::warning::gh release create did not succeed for v${VERSION} after 3 attempts (last error: ${last_error//$'\n'/ }).${reset_hint} Tag/commit already pushed — repair with: gh release create v${VERSION} --title v${VERSION} --generate-notes"
