name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 0.1.0 (no leading "v")
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Release v${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure git credentials
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GITFLOW_RELEASES_TOKEN }}@github.com" > ~/.git-credentials

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Bump version and build
        run: |
          npm version "${{ inputs.version }}" --no-git-tag-version
          npm run build

      - name: Commit, tag, and push
        env:
          GH_TOKEN: ${{ secrets.GITFLOW_RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          MAJOR="v$(echo "$VERSION" | cut -d. -f1)"

          # dist/ is gitignored on the branch itself — force-add it into this
          # one release commit, which is reachable only via the tags below,
          # never pushed onto the branch. develop/main stay dist-free forever.
          git add package.json package-lock.json
          git add -f dist
          git commit -m "chore(release): v${VERSION}"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git tag -f "$MAJOR" HEAD

          git push origin "v${VERSION}"
          git push origin -f "$MAJOR"

          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes
