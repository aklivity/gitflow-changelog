name: gitflow-changelog
description: >-
  Generates a CHANGELOG for repositories using a gitflow branching model
  (a long-running develop branch plus maintenance/support branches), placing
  each issue and pull request under the release it actually shipped in by
  walking git ancestry rather than trusting closed-at dates or timeline
  events.
author: Aklivity
branding:
  icon: file-text
  color: purple

inputs:
  owner:
    description: Repository owner.
    required: false
    default: ${{ github.repository_owner }}
  repo:
    description: Repository name.
    required: false
    default: ${{ github.event.repository.name }}
  token:
    description: GitHub token used to read issues, pull requests, and their events.
    required: false
    default: ${{ github.token }}
  ref:
    description: >-
      Branch or ref to generate the changelog for. Entries not reachable from
      this ref are dropped; entries reachable but not under any tag land in
      Unreleased.
    required: false
    default: HEAD
  git-dir:
    description: >-
      Path to a full clone of the repository (requires fetch-depth 0 — a
      shallow clone cannot answer ancestry questions). Defaults to the
      current working directory.
    required: false
  cache-path:
    description: >-
      Path to the incremental events cache file. Pair with actions/cache
      using a stable key (not hash-based) so it is found and updated on
      every run.
    required: false
    default: .gitflow-changelog-cache.json
  overrides-path:
    description: >-
      Path to a YAML file (in the consuming repo) mapping PR/issue numbers to
      a replacement commit SHA, for entries whose recorded commit no longer
      exists (e.g. after a history rewrite on another branch, or a squash
      merge that flattened it away). Auto-loaded from this default path if
      present — no workflow changes needed to start using it.
    required: false
    default: .gitflow-changelog-hash-overrides.yml
  config-path:
    description: >-
      Path to a YAML file (in the consuming repo) holding changelog policy —
      tag-pattern, enhancement-labels, bug-labels, exclude-labels, format.
      Policy belongs in one file rather than repeated inputs at every call
      site, since it doesn't vary by branch or by which step (prepare vs.
      finalize) is running. The inputs below still exist as one-off
      overrides and take precedence over the file when set.
    required: false
    default: .gitflow-changelog.yml
  upstream-cache-dir:
    description: >-
      Directory each configured upstream source (see the "upstream" key in
      config-path) is cloned into. Only used when the config declares at
      least one upstream source. Pair with actions/cache using a stable key
      (not hash-based, and not scoped to the current branch — the same
      upstream history is relevant regardless of which branch is generating
      a changelog) so the clone persists across runs: it's updated with a
      fetch on every run after the first, rather than re-cloning full
      history from scratch every time.
    required: false
    default: .gitflow-changelog-upstream
  tag-pattern:
    description: >-
      Regular expression selecting which tags get their own changelog
      section (e.g. to exclude alpha/beta/rc pre-releases). Does not affect
      ancestry placement, only which tags are rendered as sections.
      Overrides tag-pattern in config-path; defaults to matching every tag
      if set in neither place.
    required: false
  enhancement-labels:
    description: >-
      Comma-separated labels categorized as "Implemented enhancements".
      Overrides enhancement-labels in config-path; defaults to "enhancement"
      if set in neither place.
    required: false
  bug-labels:
    description: >-
      Comma-separated labels categorized as "Fixed bugs". Overrides
      bug-labels in config-path; defaults to "bug" if set in neither place.
    required: false
  exclude-labels:
    description: >-
      Comma-separated labels excluded from the changelog entirely.
      Overrides exclude-labels in config-path; defaults to
      "duplicate,invalid,wontfix" if set in neither place.
    required: false
  format:
    description: >-
      Output renderer. Only "default" is available in v1. Overrides format
      in config-path; defaults to "default" if set in neither place.
    required: false
  output-path:
    description: Path to write the generated changelog to.
    required: false
    default: CHANGELOG.md

outputs:
  changelog-path:
    description: Path to the generated changelog file.

runs:
  using: node20
  main: dist/index.js
